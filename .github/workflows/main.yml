name: 红色风传播体严格日报（单文件版）

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 06:00（UTC 22:00）
    - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: red-wind-diaspore-strict-daily
  cancel-in-progress: false

jobs:
  strict-daily-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore processed-paper history
        uses: actions/cache@v4
        with:
          path: .cache/strict_daily_seen.json
          key: strict-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            strict-daily-${{ runner.os }}-

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          "openai>=1.55,<3" "pyzotero>=1.6" "requests>=2.32"

      - name: Search, screen, and send
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          LLM_MODEL: deepseek-ai/DeepSeek-V3.2
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import smtplib
          import time
          from datetime import date, datetime, timedelta, timezone
          from email.header import Header
          from email.mime.text import MIMEText
          from email.utils import formataddr
          from pathlib import Path
          from typing import Any
          from zoneinfo import ZoneInfo

          import requests
          from openai import OpenAI
          from pyzotero import zotero


          # ---------- Only these settings normally need changing ----------
          ZOTERO_ROOT = "ZAD_红色风传播体"
          CORE_COLLECTION = "01_直接核心"
          MODEL = os.getenv("LLM_MODEL", "deepseek-ai/DeepSeek-V3.2")
          MIN_SCORE = 8.0
          MAX_DIRECT = 3
          MAX_MECHANISM = 1
          HISTORY_DAYS = 120
          LOOKBACK_DAYS = 2
          MAX_LLM_CANDIDATES = 40
          HISTORY_FILE = Path(".cache/strict_daily_seen.json")

          OPENALEX_QUERIES = [
              "samara color pigment",
              "samara colour anthocyanin",
              "wind-dispersed seed color",
              "wind-dispersed fruit colour",
              "winged diaspore coloration",
              "winged fruit anthocyanin",
              "Ailanthus samara red",
              "Acer samara color",
              "Salsola winged perianth color",
              "Haloxylon colored diaspore",
          ]

          POSITIVE_TITLES = [
              "Perianth colour affects germination behaviour",
              "Haloxylon ammodendron",
              "2种红果臭椿",
              "元宝枫",
          ]

          ALLOWED_QUESTIONS = [
              "功能与机制",
              "多压力证据",
              "系统与地理",
              "方法与验证",
          ]

          COLOR_RE = re.compile(
              r"\bcolou?r(?:ation|ed|ful|s)?\b|\bpigment(?:ation|ed|s)?\b|"
              r"\banthocyan\w*\b|\bflavonoid\w*\b|\bcarotenoid\w*\b|"
              r"\bchromatic\b|\breflectance\b|\bspectral\b|"
              r"\b(?:red|reddish|redness|pink|purple|violet|yellow|orange|blue|black)\b",
              re.I,
          )
          DIRECT_RE = re.compile(
              r"\bsamaras?\b|\banemochor\w*\b|\bwind[- ](?:dispers\w*|borne)\b|"
              r"\bwinged[- ]?(?:seed|fruit|diaspore|propagule|perianth|bract)s?\b|"
              r"\b(?:seed|fruit|diaspore|propagule|perianth|bract)[- ]?wings?\b|"
              r"\bautorotat\w*\b",
              re.I,
          )
          REPRODUCTIVE_RE = re.compile(
              r"\b(?:seed|fruit|diaspore|propagule|samara|pericarp|perianth|bract|"
              r"cone|peduncle|infructescence)s?\b",
              re.I,
          )
          MECHANISM_RE = re.compile(
              r"\bfunction\w*\b|\badapt\w*\b|\bevol\w*\b|\bphylogen\w*\b|"
              r"\bconvergen\w*\b|\bbiogeograph\w*\b|\bdevelopment\w*\b|"
              r"\bmatur\w*\b|\bresource allocation\b|\bphotoprotect\w*\b|"
              r"\bultraviolet\b|\bUV[- ]?[AB]?\b|\bantioxid\w*\b|"
              r"\btemperatur\w*\b|\bthermal\b|\bcold\b|\bheat\b|"
              r"\bpathogen\w*\b|\bfung\w*\b|\bantimicrob\w*\b|"
              r"\bdorman\w*\b|\bgerminat\w*\b|\bviabil\w*\b|"
              r"\bdefen[cs]\w*\b|\bherbivor\w*\b|\bmimic\w*\b|"
              r"\baposemat\w*\b|\bstress\w*\b|\babiotic\b|\bclimat\w*\b",
              re.I,
          )


          def log(message: str) -> None:
              print(f"[{datetime.now(timezone.utc).isoformat(timespec='seconds')}] {message}", flush=True)


          def required_env(name: str) -> str:
              value = os.getenv(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing GitHub Secret: {name}")
              return value


          def get_json(url: str, params: dict[str, Any] | None = None) -> dict[str, Any]:
              for attempt in range(4):
                  try:
                      response = requests.get(
                          url,
                          params=params,
                          timeout=45,
                          headers={"User-Agent": "strict-red-wind-diaspore-daily/1.0"},
                      )
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      if attempt == 3:
                          log(f"Request failed and was skipped: {exc}")
                          return {}
                      time.sleep(2 ** attempt)
              return {}


          def reconstruct_abstract(index: dict[str, list[int]] | None) -> str:
              if not index:
                  return ""
              maximum = max(
                  (position for positions in index.values() for position in positions),
                  default=-1,
              )
              if maximum < 0:
                  return ""
              words = [""] * (maximum + 1)
              for word, positions in index.items():
                  for position in positions:
                      if 0 <= position <= maximum:
                          words[position] = word
              return " ".join(word for word in words if word)


          def fetch_openalex() -> list[dict[str, Any]]:
              end = date.today()
              start = end - timedelta(days=LOOKBACK_DAYS)
              filters = (
                  f"from_publication_date:{start.isoformat()},"
                  f"to_publication_date:{end.isoformat()},"
                  "has_abstract:true,type:article|review"
              )
              select = (
                  "id,doi,display_name,authorships,abstract_inverted_index,"
                  "publication_date,primary_location,best_oa_location,type"
              )
              unique: dict[str, dict[str, Any]] = {}
              for query in OPENALEX_QUERIES:
                  payload = get_json(
                      "https://api.openalex.org/works",
                      {
                          "search": query,
                          "filter": filters,
                          "per_page": 25,
                          "sort": "publication_date:desc",
                          "select": select,
                      },
                  )
                  for raw in payload.get("results", []):
                      title = str(raw.get("display_name") or "").strip()
                      abstract = reconstruct_abstract(raw.get("abstract_inverted_index"))
                      if not title or not abstract:
                          continue
                      authors = []
                      for authorship in raw.get("authorships") or []:
                          author = (authorship.get("author") or {}).get("display_name")
                          if author:
                              authors.append(str(author))
                      best = raw.get("best_oa_location") or {}
                      primary = raw.get("primary_location") or {}
                      doi = str(raw.get("doi") or "")
                      url = (
                          best.get("landing_page_url")
                          or primary.get("landing_page_url")
                          or doi
                          or raw.get("id")
                          or ""
                      )
                      key = (doi or str(raw.get("id") or title)).lower()
                      unique[key] = {
                          "title": title,
                          "abstract": abstract,
                          "authors": authors,
                          "date": str(raw.get("publication_date") or ""),
                          "doi": doi,
                          "url": str(url),
                          "source": "OpenAlex",
                      }
              log(f"OpenAlex: {len(unique)} unique recent papers")
              return list(unique.values())


          def fetch_biorxiv() -> list[dict[str, Any]]:
              end = date.today()
              start = end - timedelta(days=LOOKBACK_DAYS)
              cursor = 0
              results: list[dict[str, Any]] = []
              while cursor < 2000:
                  payload = get_json(
                      f"https://api.biorxiv.org/details/biorxiv/"
                      f"{start.isoformat()}/{end.isoformat()}/{cursor}"
                  )
                  batch = payload.get("collection") or []
                  if not batch:
                      break
                  for raw in batch:
                      category = str(raw.get("category") or "").strip().lower()
                      if category not in {"plant biology", "ecology"}:
                          continue
                      title = str(raw.get("title") or "").strip()
                      abstract = str(raw.get("abstract") or "").strip()
                      if not title or not abstract:
                          continue
                      doi = str(raw.get("doi") or "").strip()
                      results.append(
                          {
                              "title": title,
                              "abstract": abstract,
                              "authors": [
                                  value.strip()
                                  for value in str(raw.get("authors") or "").split(";")
                                  if value.strip()
                              ],
                              "date": str(raw.get("date") or ""),
                              "doi": doi,
                              "url": f"https://doi.org/{doi}" if doi else "https://www.biorxiv.org/",
                              "source": "bioRxiv",
                          }
                      )
                  total = 0
                  messages = payload.get("messages") or []
                  if messages:
                      try:
                          total = int(messages[0].get("total") or 0)
                      except (TypeError, ValueError):
                          total = 0
                  cursor += len(batch)
                  if len(batch) == 0 or (total and cursor >= total):
                      break
              log(f"bioRxiv: {len(results)} recent plant/ecology papers")
              return results


          def paper_identity(paper: dict[str, Any]) -> str:
              doi = str(paper.get("doi") or "").lower().strip()
              doi = re.sub(r"^https?://(?:dx\.)?doi\.org/", "", doi)
              if doi:
                  return f"doi:{doi}"
              title = re.sub(r"[^a-z0-9]+", " ", str(paper.get("title") or "").lower()).strip()
              return "title:" + hashlib.sha256(title.encode("utf-8")).hexdigest()


          def deduplicate(papers: list[dict[str, Any]]) -> list[dict[str, Any]]:
              unique: dict[str, dict[str, Any]] = {}
              for paper in papers:
                  unique[paper_identity(paper)] = paper
              return list(unique.values())


          def load_history() -> dict[str, str]:
              if not HISTORY_FILE.exists():
                  return {}
              try:
                  raw = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  if not isinstance(raw, dict):
                      return {}
              except Exception as exc:
                  log(f"History file was unreadable; starting clean: {exc}")
                  return {}
              cutoff = datetime.now(timezone.utc) - timedelta(days=HISTORY_DAYS)
              kept: dict[str, str] = {}
              for key, timestamp in raw.items():
                  try:
                      when = datetime.fromisoformat(str(timestamp))
                      if when.tzinfo is None:
                          when = when.replace(tzinfo=timezone.utc)
                      if when >= cutoff:
                          kept[str(key)] = str(timestamp)
                  except (TypeError, ValueError):
                      continue
              return kept


          def save_history(history: dict[str, str], processed: list[str]) -> None:
              now = datetime.now(timezone.utc).isoformat()
              for key in processed:
                  history[key] = now
              HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
              HISTORY_FILE.write_text(
                  json.dumps(history, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )


          def fetch_zotero_anchors() -> list[dict[str, str]]:
              client = zotero.Zotero(required_env("ZOTERO_ID"), "user", required_env("ZOTERO_KEY"))
              collections_list = client.everything(client.collections())
              collections = {item["key"]: item for item in collections_list}
              path_cache: dict[str, str] = {}

              def collection_path(key: str, visiting: set[str] | None = None) -> str:
                  if key in path_cache:
                      return path_cache[key]
                  visiting = set() if visiting is None else visiting
                  if key in visiting or key not in collections:
                      return ""
                  visiting.add(key)
                  data = collections[key].get("data") or {}
                  name = str(data.get("name") or "")
                  parent = str(data.get("parentCollection") or "")
                  parent_path = collection_path(parent, visiting) if parent else ""
                  value = f"{parent_path}/{name}" if parent_path else name
                  path_cache[key] = value
                  return value

              items = client.everything(
                  client.items(itemType="conferencePaper || journalArticle || preprint")
              )
              in_target = 0
              anchors: list[dict[str, str]] = []
              for raw in items:
                  data = raw.get("data") or {}
                  paths = [
                      collection_path(str(key))
                      for key in (data.get("collections") or [])
                  ]
                  if not any(
                      path == ZOTERO_ROOT or path.startswith(ZOTERO_ROOT + "/")
                      for path in paths
                  ):
                      continue
                  in_target += 1
                  if not any(CORE_COLLECTION in path for path in paths):
                      continue
                  title = str(data.get("title") or "").strip()
                  abstract = str(data.get("abstractNote") or "").strip()
                  if not title or not abstract:
                      continue
                  text = f"{title}\n{abstract}"
                  direct_match = bool(COLOR_RE.search(text) and DIRECT_RE.search(text))
                  positive_match = any(value.lower() in title.lower() for value in POSITIVE_TITLES)
                  if direct_match or positive_match:
                      anchors.append({"title": title, "abstract": abstract})
              log(f"Zotero target collection: {in_target} readable items; strict anchors: {len(anchors[:6])}")
              return anchors[:6]


          def prefilter(paper: dict[str, Any]) -> str | None:
              text = f"{paper.get('title', '')}\n{paper.get('abstract', '')}"
              if not COLOR_RE.search(text):
                  return None
              if DIRECT_RE.search(text):
                  return "A"
              if REPRODUCTIVE_RE.search(text) and MECHANISM_RE.search(text):
                  return "B"
              return None


          def extract_json_object(text: str) -> dict[str, Any] | None:
              cleaned = (text or "").strip()
              cleaned = re.sub(r"^```(?:json)?\s*", "", cleaned, flags=re.I)
              cleaned = re.sub(r"\s*```$", "", cleaned)
              start = cleaned.find("{")
              end = cleaned.rfind("}")
              if start < 0 or end <= start:
                  return None
              try:
                  value = json.loads(cleaned[start : end + 1])
              except json.JSONDecodeError:
                  return None
              return value if isinstance(value, dict) else None


          def ask_llm(client: OpenAI, messages: list[dict[str, str]], max_tokens: int) -> str | None:
              for attempt in range(3):
                  try:
                      response = client.chat.completions.create(
                          model=MODEL,
                          messages=messages,
                          max_tokens=max_tokens,
                      )
                      return str(response.choices[0].message.content or "").strip()
                  except Exception as exc:
                      log(f"LLM request failed ({attempt + 1}/3): {exc}")
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              return None


          def judge_paper(
              client: OpenAI,
              paper: dict[str, Any],
              possible_tier: str,
              anchors: list[dict[str, str]],
          ) -> dict[str, Any] | None:
              anchor_text = "\n".join(
                  f"- {item['title']}: {item['abstract'][:1000]}" for item in anchors
              )
              if not anchor_text:
                  anchor_text = "- Zotero anchor unavailable; apply the written target conservatively."
              prompt = f"""You are the final relevance gate for a very narrow botanical daily alert.

          RESEARCH TARGET
          Study why wind-dispersed plant diaspores and their dispersal structures are coloured, especially red: origin, evolution, resource allocation, development, geography, ecology, and non-visual physiological functions. Target structures include samaras, winged fruits, winged seeds, winged perianths/bracts and other wind-dispersed propagules. Mechanisms of interest include photoprotection/UV/oxidative/thermal protection, pathogen or fungal defence, dormancy/germination, mimicry or non-feeding defence, animal avoidance, convergence/phylogenetic constraint, and environmental drivers.

          USER'S ZOTERO CORE ANCHORS
          {anchor_text}

          DECISION RULES
          A_DIRECT: Directly studies coloration/pigmentation of a wind-dispersed plant diaspore or dispersal structure and addresses a relevant function, mechanism, development, allocation, ecology, geography, or evolution.
          B_MECHANISM: Not a direct wind-dispersal paper, but experimentally or comparatively tests a transferable NON-VISUAL pigment function in a plant reproductive structure, such as UV/oxidative/thermal protection, pathogen defence, dormancy/germination, or abiotic stress.
          C_CONTEXT: Background or method only. Never email it.
          REJECT: Off topic or weak keyword overlap. Reject flower colour/pollination, visual attraction by animal-dispersed fleshy fruits, leaves/stems/autumn colour, animal coloration, generic crop/pigment chemistry, and generic wind aerodynamics without coloration. Wind pollination is not wind dispersal. If uncertain, reject.

          The keyword prefilter labelled this candidate {possible_tier}; verify independently.

          TITLE: {paper['title']}
          ABSTRACT: {paper['abstract'][:7000]}

          Return exactly one JSON object and no markdown:
          {{"tier":"A_DIRECT|B_MECHANISM|C_CONTEXT|REJECT","score":0-10,"reason_zh":"one concise Chinese sentence","questions":["功能与机制","多压力证据","系统与地理","方法与验证"]}}
          Only include question labels genuinely supported by the paper. False positives are much worse than false negatives."""
              raw = ask_llm(
                  client,
                  [
                      {
                          "role": "system",
                          "content": "Be a conservative scientific relevance classifier.",
                      },
                      {"role": "user", "content": prompt},
                  ],
                  800,
              )
              if raw is None:
                  return None
              result = extract_json_object(raw)
              if result is None:
                  log(f"Invalid judge JSON; will retry this paper next day: {paper['title']}")
                  return None
              tier = str(result.get("tier") or "REJECT").strip().upper()
              if tier not in {"A_DIRECT", "B_MECHANISM", "C_CONTEXT", "REJECT"}:
                  tier = "REJECT"
              try:
                  score = max(0.0, min(10.0, float(result.get("score") or 0)))
              except (TypeError, ValueError):
                  score = 0.0
              raw_questions = result.get("questions")
              if not isinstance(raw_questions, list):
                  raw_questions = []
              questions = [value for value in ALLOWED_QUESTIONS if value in raw_questions]
              return {
                  "tier": tier,
                  "score": score,
                  "reason": str(result.get("reason_zh") or "未提供相关性说明").strip(),
                  "questions": questions,
              }


          def add_tldr(client: OpenAI, paper: dict[str, Any]) -> None:
              prompt = f"""请用中文概括下面论文，严格写 2 句话：
          1. 第一句说明研究对象、方法和主要发现。
          2. 第二句说明它对“风传播繁殖体颜色，尤其红色的功能、形成或演化”有什么直接价值。
          不要夸大，不要补充摘要中没有的信息。

          标题：{paper['title']}
          摘要：{paper['abstract'][:7000]}"""
              result = ask_llm(
                  client,
                  [
                      {"role": "system", "content": "你是严谨的植物生态学论文编辑。"},
                      {"role": "user", "content": prompt},
                  ],
                  500,
              )
              paper["tldr"] = result or "摘要生成暂时失败，请直接查看论文原文。"


          def render_email(papers: list[dict[str, Any]]) -> str:
              today_cn = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y/%m/%d")
              style = """
              <style>
                body { font-family: Arial, sans-serif; color: #222; line-height: 1.65; }
                .wrap { max-width: 820px; margin: auto; }
                .paper { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin: 18px 0; }
                .tier { display: inline-block; color: white; background: #9b1c31; padding: 2px 8px; border-radius: 12px; }
                .meta { color: #666; font-size: 0.92em; }
                .reason { background: #fff5f5; border-left: 4px solid #9b1c31; padding: 10px; }
                a { color: #0969da; }
              </style>
              """
              if not papers:
                  content = f"""
                  <div class="wrap">
                    <h2>红色风传播体严格日报 · {today_cn}</h2>
                    <h3>今日没有高度相关文章（No Papers Today）</h3>
                    <p>近期检索结果中没有论文同时通过关键词预筛选和 8 分严格相关性门槛，因此今天不以低相关论文凑数。</p>
                  </div>
                  """
                  return style + content

              cards = []
              for index, paper in enumerate(papers, start=1):
                  tier_label = "A 类：直接相关" if paper["tier"] == "A_DIRECT" else "B 类：机制相关"
                  authors = ", ".join(paper.get("authors") or []) or "作者信息暂缺"
                  questions = "、".join(paper.get("questions") or []) or "未标注"
                  cards.append(
                      f"""
                      <div class="paper">
                        <div><span class="tier">{html.escape(tier_label)}</span>　严格相关 {paper['score']:.1f}/10</div>
                        <h3>{index}. {html.escape(paper['title'])}</h3>
                        <p class="meta">{html.escape(authors)}<br>{html.escape(paper.get('source', ''))} · {html.escape(paper.get('date', ''))}</p>
                        <p class="reason"><strong>为什么推荐：</strong>{html.escape(paper['reason'])}</p>
                        <p><strong>对应研究问题：</strong>{html.escape(questions)}</p>
                        <p><strong>中文概括：</strong>{html.escape(paper.get('tldr', ''))}</p>
                        <p><a href="{html.escape(paper.get('url', ''), quote=True)}">打开论文</a></p>
                      </div>
                      """
                  )
              return style + f"""
              <div class="wrap">
                <h2>红色风传播体严格日报 · {today_cn}</h2>
                <p>今天共有 {len(papers)} 篇论文通过严格门槛；A 类最多 3 篇，B 类最多 1 篇。</p>
                {''.join(cards)}
              </div>
              """


          def send_email(html_body: str, paper_count: int) -> None:
              sender = required_env("SENDER")
              receiver_raw = required_env("RECEIVER")
              password = required_env("SENDER_PASSWORD")
              receivers = [
                  value.strip()
                  for value in re.split(r"[,;]", receiver_raw)
                  if value.strip()
              ]
              if not receivers:
                  raise RuntimeError("RECEIVER is empty")
              today_cn = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y/%m/%d")
              message = MIMEText(html_body, "html", "utf-8")
              message["From"] = formataddr((str(Header("GitHub Actions", "utf-8")), sender))
              message["To"] = ", ".join(receivers)
              message["Subject"] = str(Header(f"红色风传播体严格日报 {today_cn}（{paper_count}篇）", "utf-8"))
              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=45) as server:
                  server.login(sender, password)
                  server.sendmail(sender, receivers, message.as_string())


          def main() -> None:
              api_key = required_env("OPENAI_API_KEY")
              base_url = os.getenv("OPENAI_API_BASE", "").strip() or None
              llm_client = OpenAI(api_key=api_key, base_url=base_url)

              anchors = fetch_zotero_anchors()
              history = load_history()
              fetched = deduplicate(fetch_openalex() + fetch_biorxiv())
              unseen = [paper for paper in fetched if paper_identity(paper) not in history]
              log(f"Combined: {len(fetched)} unique papers; {len(unseen)} unseen")

              processed: list[str] = []
              candidates: list[dict[str, Any]] = []
              for paper in unseen:
                  possible_tier = prefilter(paper)
                  if possible_tier is None:
                      processed.append(paper_identity(paper))
                      continue
                  paper["possible_tier"] = possible_tier
                  candidates.append(paper)

              candidates.sort(
                  key=lambda paper: (
                      paper.get("possible_tier") == "A",
                      str(paper.get("date") or ""),
                  ),
                  reverse=True,
              )
              candidates = candidates[:MAX_LLM_CANDIDATES]
              log(f"Keyword prefilter: {len(candidates)} papers sent to strict judge")

              direct: list[dict[str, Any]] = []
              mechanism: list[dict[str, Any]] = []
              for paper in candidates:
                  decision = judge_paper(
                      llm_client,
                      paper,
                      str(paper["possible_tier"]),
                      anchors,
                  )
                  if decision is None:
                      continue
                  processed.append(paper_identity(paper))
                  paper.update(decision)
                  if paper["score"] < MIN_SCORE:
                      continue
                  if paper["tier"] == "A_DIRECT":
                      direct.append(paper)
                  elif paper["tier"] == "B_MECHANISM":
                      mechanism.append(paper)

              direct.sort(key=lambda paper: (paper["score"], paper.get("date", "")), reverse=True)
              mechanism.sort(key=lambda paper: (paper["score"], paper.get("date", "")), reverse=True)
              selected = direct[:MAX_DIRECT] + mechanism[:MAX_MECHANISM]
              log(
                  f"Strict result: {len(selected)} selected "
                  f"({min(len(direct), MAX_DIRECT)} direct, "
                  f"{min(len(mechanism), MAX_MECHANISM)} mechanism)"
              )

              for paper in selected:
                  add_tldr(llm_client, paper)

              send_email(render_email(selected), len(selected))
              save_history(history, processed)
              log("Email sent successfully; history updated")


          if __name__ == "__main__":
              main()
          PY
